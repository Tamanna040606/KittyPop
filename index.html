<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CatCloud | Discover Cute Cats</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <h1>🐾 CatCloud</h1>
        <p>Your daily dose of cuteness!</p>
    </header>

    <main>

        <section class="cat-container">

            <h2>Meet Your New Favourite Cat! 🐱</h2>

            <div class="cat-card">

                <img id="catImage"
                     src="https://placehold.co/400x300?text=Loading+Cat..."
                     alt="Random cute cat">

                <div class="buttons">

                    <button id="nextBtn">
                        🐾 Another Cat
                    </button>

                    <button id="likeBtn">
                        ❤️ Like
                    </button>

                    <button id="downloadBtn">
                        📥 Download
                    </button>

                </div>

            </div>

            <p id="message">Click the button to discover a cute cat!</p>

        </section>

        <section class="favorites-section">

            <h2>❤️ Your Favourite Cats</h2>

            <div id="favoritesContainer">
                <p>No favourites yet. Start liking some cats!</p>
            </div>

        </section>

    </main>

    <footer>
        <p>Made with ❤️ and lots of meows | CatCloud © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
